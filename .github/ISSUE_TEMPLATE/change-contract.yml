name: Контракт изменения
description: Предложить изменение кода с контрактом repo-guard.
title: "[change] "
body:
  - type: markdown
    attributes:
      value: |
        Опишите предлагаемое изменение и добавьте блок контракта YAML.
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что меняется и зачем?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Контракт изменения
      description: Вставьте блок контракта repo-guard в формате YAML.
      value: |
        ```repo-guard-yaml
        change_type: feature
        scope:
          - src/
        budgets: {}
        anchors:
          affects:
            - FR-014
          implements:
            - FR-014
          verifies:
            - FR-014
        # Раскомментируйте и перечислите управляющие файлы, изменение которых санкционирует эта задача.
        # Только контракт в теле ЭТОЙ задачи может разрешить изменение policy.paths.governance_paths.
        # authorized_governance_paths:
        #   - repo-policy.json
        must_touch: []
        must_not_touch: []
        expected_effects:
          - Опишите ожидаемый эффект
        ```
    validations:
      required: true
