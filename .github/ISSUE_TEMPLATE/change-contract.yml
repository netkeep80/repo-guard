name: Контракт изменения
description: Предложить изменение с ChangeIntent и, при необходимости, отдельным GovernanceGrant.
title: "[change] "
body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что меняется и зачем?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: ChangeIntent
      description: Обычное намерение изменения. Этот блок сам по себе не даёт управляющих разрешений.
      value: |
        ```repo-guard-yaml
        change_type: feature
        scope:
          - src/**
        budgets: {}
        anchors:
          affects: []
          implements: []
          verifies: []
        must_touch: []
        must_not_touch: []
        expected_effects:
          - Опишите ожидаемый эффект
        ```
    validations:
      required: true
  - type: textarea
    id: governance_grant
    attributes:
      label: GovernanceGrant (только для управляющих изменений)
      description: Оставьте пустым для обычной задачи. Grant доверяется только из связанной задачи, никогда из PR.
      value: |
        ```repo-guard-grant
        authorized_governance_paths:
          - repo-policy.json
        allow_policy_relaxation: []
        ```
    validations:
      required: false
