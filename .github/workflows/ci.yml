name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Acquire minimal Git evidence
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --unshallow origin               "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"               "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --no-tags --prune --unshallow origin               "+refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - name: Verify generated dist freshness
        run: npm run check:dist

      - name: Verify real local documentation projections
        run: |
          set -euo pipefail
          node scripts/self-host-docs.mjs --check
          node scripts/self-host-docs.mjs --outputs > "$RUNNER_TEMP/repo-guard-doc-outputs.json"
          EXACT_SHA="$(git rev-parse HEAD)"
          node dist/repo-guard.mjs build --base "$EXACT_SHA" --head "$EXACT_SHA" --outputs "$RUNNER_TEMP/repo-guard-doc-outputs.json"
          test -z "$(git status --porcelain)"

      - name: Run compiler-only self-host witness
        if: github.event_name == 'pull_request'
        run: >-
          node dist/repo-guard.mjs check
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --format summary

      - name: Run discovered test suite
        run: node tests/run.mjs

      - name: Publish repo-guard summary
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: echo "### repo-guard" >> "$GITHUB_STEP_SUMMARY"

  smoke-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Smoke-test packaged artifact
        run: |
          set -euo pipefail
          npm pack --ignore-scripts 2>/dev/null
          TARBALL=$(ls repo-guard-*.tgz)
          REPODIR="$PWD"
          TMPDIR=$(mktemp -d)
          npm install --prefix "$TMPDIR" "$REPODIR/$TARBALL"
          EXACT_SHA="$(git rev-parse HEAD)"
          "$TMPDIR/node_modules/.bin/repo-guard" --repo-root "$REPODIR"             check --base "$EXACT_SHA" --head "$EXACT_SHA" --format summary
