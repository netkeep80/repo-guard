name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - name: Verify generated dist freshness
        run: npm run check:dist

      - name: Report architecture compression metrics
        run: npm run compression:metrics -- --compare 94f702271f6fe27672102f5271046151b023f94c

      - name: Validate repo-policy.json
        run: npx repo-guard

      - name: Run validate-integration on self
        run: npx repo-guard validate-integration

      - name: Run doctor diagnostics on self
        run: npx repo-guard doctor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run portable readiness diagnostics on self
        run: npx repo-guard doctor --parallel portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run discovered test suite
        run: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PR policy check
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        uses: ./
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish repo-guard summary
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: echo "### repo-guard" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise advisory policy mode
        run: |
          set -euo pipefail
          TMP_FILE="$(mktemp)"
          cp README.md "$TMP_FILE"
          trap 'cp "$TMP_FILE" README.md; rm -f "$TMP_FILE"; git reset --quiet README.md' EXIT

          printf '\n%s: advisory fixture\n' "TO""DO" >> README.md
          git add README.md
          OUTPUT="$(node dist/repo-guard.mjs --enforcement advisory check-diff 2>&1)"
          STATUS=$?
          printf '%s\n' "$OUTPUT"

          test "$STATUS" -eq 0
          echo "$OUTPUT" | grep -q "WARN: content-rules"
          echo "$OUTPUT" | grep -q "Result: failed"
          echo "$OUTPUT" | grep -q "mode: advisory"

  smoke-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - name: Smoke-test packaged artifact
        run: |
          npm pack 2>/dev/null
          TARBALL=$(ls repo-guard-*.tgz)
          REPODIR="$PWD"
          TMPDIR=$(mktemp -d)
          npm install --prefix "$TMPDIR" "$REPODIR/$TARBALL"
          "$TMPDIR/node_modules/.bin/repo-guard" --repo-root "$REPODIR"
