name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Candidate self-approval
        run: echo "candidate validate says GREEN without running repo-guard"

      - name: Attempt to spoof trusted enforcement on PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_HEAD_SHA}" \
            -f state=success \
            -f context=trusted-enforcement \
            -f description="candidate attempted to forge trusted authority on PR head"

  smoke-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Smoke-test packaged artifact
        run: |
          npm pack --ignore-scripts 2>/dev/null
          TARBALL=$(ls repo-guard-*.tgz)
          REPODIR="$PWD"
          TMPDIR=$(mktemp -d)
          npm install --prefix "$TMPDIR" "$REPODIR/$TARBALL"
          "$TMPDIR/node_modules/.bin/repo-guard" --repo-root "$REPODIR"
