name: C3.10b bounded self-apply

on:
  push:
    branches: [c3.10b/507-policy-packs-design]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify exact workflow-pack RED production base
        run: |
          set -euo pipefail
          git diff --exit-code 8e33a6a01ed11d5a3d046ad091d1a55440b542b6 -- src/policy-profiles.mts schemas/repo-policy.schema.json dist/policy-profiles.mjs

      - name: Normalize bounded transport precondition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/policy-profiles.mts')
          text = path.read_text()
          old = 'export const listBuiltInPacks = (): string[] => [...Object.keys(PACKS), VERSION_GOVERNANCE_PACK].sort();'
          new = 'export const listBuiltInPacks = (): string[] => [...Object.keys(PACKS), VERSION_GOVERNANCE_PACK] .sort();'
          if text.count(old) != 1:
              raise SystemExit('expected exact listBuiltInPacks transport precondition once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply reviewed repo-guard-workflow patch
        run: node tests/c3-10b-apply.mjs

      - name: Normalize bounded transport transcription
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/policy-profiles.mts')
          text = path.read_text()
          if text.count('nalue') != 1:
              raise SystemExit('expected exactly one nalue transport transcription')
          if text.count('REPE_GUARD_WORKFLOW_') != 3:
              raise SystemExit('expected exactly three REPE_GUARD_WORKFLOW_ transport transcriptions')
          wrong_yaml_check = r'/\\.ya?ml$/i.test(path)'
          right_yaml_check = '(path.toLowerCase().endsWith(".yml") || path.toLowerCase().endsWith(".yaml"))'
          if text.count(wrong_yaml_check) != 1:
              raise SystemExit('expected exactly one double-escaped YAML transport check')
          text = text.replace('nalue', 'value')
          text = text.replace('REPE_GUARD_WORKFLOW_', 'REPO_GUARD_WORKFLOW_')
          text = text.replace(wrong_yaml_check, right_yaml_check)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build canonical dist
        run: npm run build

      - name: Verify targeted C3.10b contracts
        run: |
          node tests/test-c3-10b-policy-packs.mjs
          node tests/test-c3-10b-repo-guard-workflow-pack.mjs

      - name: Verify clean patch shape
        run: git diff --check

      - name: Remove transport artifacts and publish verified GREEN candidate
        run: |
          set -euo pipefail
          rm tests/c3-10b-apply.mjs .github/workflows/c3-10b-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "C3.10b: lower repo-guard workflow pack"
          git push origin HEAD:c3.10b/507-policy-packs-design
