name: C3.10b bounded self-apply

on:
  push:
    branches: [c3.10b/507-policy-packs-design]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify exact RED production base
        run: |
          set -euo pipefail
          git diff --exit-code 5d5ae38d5a24752ea71d18ca13758a245f9c1a46 -- src/policy-profiles.mts schemas/repo-policy.schema.json dist/policy-profiles.mjs

      - name: Apply reviewed version-governance patch
        run: node tests/c3-10b-apply.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build canonical dist
        run: npm run build

      - name: Verify targeted C3.10b contract
        run: node tests/test-c3-10b-policy-packs.mjs

      - name: Verify clean patch shape
        run: git diff --check

      - name: Remove transport artifacts and publish verified GREEN candidate
        run: |
          set -euo pipefail
          rm tests/c3-10b-apply.mjs .github/workflows/c3-10b-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "C3.10b: lower version governance pack"
          git push origin HEAD:c3.10b/507-policy-packs-design
