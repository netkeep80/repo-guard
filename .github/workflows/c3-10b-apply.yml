name: C3.10b bounded apply

on:
  push:
    branches:
      - c3.10b/507-policy-packs-design

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact transport parent
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="b9fac68c1fcbb9e50fc4f6a4eae6f095bf006996"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/c3-10b-apply.yml"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reviewed deletion patch
        run: python3 tests/c3-10b-apply.py

      - name: Build official dist
        run: npm run build

      - name: Verify targeted cutover contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/test-c3-10b-profile-surface-cutover.mjs
          node tests/validate-schemas.mjs
          node tests/test-policy-profiles.mjs
          node tests/test-c3-10b-policy-packs.mjs
          node tests/test-c3-10b-repo-guard-workflow-pack.mjs
          npm run check:dist
          git diff --check

      - name: Verify bounded production diff
        shell: bash
        run: |
          set -euo pipefail
          git rm tests/c3-10b-apply.py .github/workflows/c3-10b-apply.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed=(
            dist/policy-profiles.mjs
            schemas/repo-policy.schema.json
            src/policy-profiles.mts
            tests/test-policy-profiles.mjs
            tests/validate-schemas.mjs
            tests/c3-10b-apply.py
            .github/workflows/c3-10b-apply.yml
          )
          for path in "${changed[@]}"; do
            found=0
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then found=1; break; fi
            done
            test "$found" -eq 1 || { echo "Unexpected changed path: $path"; exit 1; }
          done

      - name: Publish production commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "C3.10b: remove legacy profile frontend"
          git push origin HEAD:c3.10b/507-policy-packs-design
