name: C3.10a one-shot rebuild

on:
  push:
    branches:
      - c3.10a/505-external-base-projection

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c3.10a/505-external-base-projection
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Commit generated runtime
        shell: bash
        run: |
          rm .github/workflows/c3-10a-rebuild.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist .github/workflows/c3-10a-rebuild.yml
          git commit -m "build(c3.10a): refresh generated runtime"
          git push origin HEAD:c3.10a/505-external-base-projection
