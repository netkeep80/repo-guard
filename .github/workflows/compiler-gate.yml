name: RepoGuard compiler gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  compiler-gate:
    name: compiler-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted evaluator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Acquire exact candidate Git object
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          EVALUATOR_SHA="$(git rev-parse HEAD)"
          test "$EVALUATOR_SHA" = "$BASE_SHA"

          git fetch --no-tags --prune origin             "+refs/pull/${PR_NUMBER}/head:refs/remotes/repo-guard/candidate"

          OBSERVED_HEAD="$(git rev-parse refs/remotes/repo-guard/candidate)"
          test "$OBSERVED_HEAD" = "$HEAD_SHA"

          echo "repository=${GITHUB_REPOSITORY}"
          echo "base=${BASE_SHA}"
          echo "head=${HEAD_SHA}"
          echo "evaluator=${EVALUATOR_SHA}"

      - name: Install accepted evaluator runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Run accepted compiler
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          EVALUATOR_SHA="$(git rev-parse HEAD)"
          test "$EVALUATOR_SHA" = "$BASE_SHA"
          node dist/repo-guard.mjs check             --base "$BASE_SHA"             --head "$HEAD_SHA"             --format summary
