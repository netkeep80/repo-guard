name: Release integrity

on:
  workflow_run:
    workflows: ["Atomic release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify, for example v1.0.1"
        required: true
        type: string

permissions: {}

jobs:
  resolve-automatic-target:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      tag: ${{ steps.target.outputs.tag }}
      source_run_id: ${{ steps.target.outputs.source_run_id }}
      source_run_attempt: ${{ steps.target.outputs.source_run_attempt }}
    steps:
      - name: Verify Atomic release workflow origin
        env:
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_WORKFLOW_PATH" = ".github/workflows/release.yml"
          test "$SOURCE_EVENT" = "repository_dispatch"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Download exact release target identity
        uses: actions/download-artifact@v5
        with:
          name: release-target-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/release-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate exact release target identity
        id: target
        env:
          TARGET_FILE: ${{ runner.temp }}/release-target/release-target.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jq -e '
            type == "object"
            and .schema_version == 1
            and (keys | sort) == ["schema_version", "source_run_attempt", "source_run_id", "tag", "target_sha"]
          ' "$TARGET_FILE" >/dev/null
          TARGET_SHA="$(jq -er '.target_sha' "$TARGET_FILE")"
          TAG="$(jq -er '.tag' "$TARGET_FILE")"
          ARTIFACT_RUN_ID="$(jq -er '.source_run_id' "$TARGET_FILE")"
          ARTIFACT_RUN_ATTEMPT="$(jq -er '.source_run_attempt' "$TARGET_FILE")"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_RUN_ID" = "$SOURCE_RUN_ID"
          test "$ARTIFACT_RUN_ATTEMPT" = "$SOURCE_RUN_ATTEMPT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  verify-automatic:
    if: ${{ github.event_name == 'workflow_run' }}
    needs: resolve-automatic-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-automatic-target.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify exact published release target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-automatic-target.outputs.tag }}
          TARGET_SHA: ${{ needs.resolve-automatic-target.outputs.target_sha }}
        run: node scripts/verify-release-ref.mjs --tag "$RELEASE_TAG" --expected-sha "$TARGET_SHA"

  record-automatic-evidence:
    if: ${{ always() && github.event_name == 'workflow_run' && needs.resolve-automatic-target.result == 'success' }}
    needs:
      - resolve-automatic-target
      - verify-automatic
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record exact release integrity evidence
        env:
          TARGET_SHA: ${{ needs.resolve-automatic-target.outputs.target_sha }}
          TAG: ${{ needs.resolve-automatic-target.outputs.tag }}
          SOURCE_RELEASE_RUN_ID: ${{ needs.resolve-automatic-target.outputs.source_run_id }}
          SOURCE_RELEASE_RUN_ATTEMPT: ${{ needs.resolve-automatic-target.outputs.source_run_attempt }}
          VERIFY_CONCLUSION: ${{ needs.verify-automatic.result }}
          VERIFY_RUN_ID: ${{ github.run_id }}
          VERIFY_RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERIFY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          case "$VERIFY_CONCLUSION" in
            success|failure|cancelled|skipped) ;;
            *) exit 1 ;;
          esac
          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg tag "$TAG" \
            --argjson source_release_run_id "$SOURCE_RELEASE_RUN_ID" \
            --argjson source_release_run_attempt "$SOURCE_RELEASE_RUN_ATTEMPT" \
            --argjson run_id "$VERIFY_RUN_ID" \
            --argjson run_attempt "$VERIFY_RUN_ATTEMPT" \
            --arg run_url "$VERIFY_RUN_URL" \
            --arg conclusion "$VERIFY_CONCLUSION" \
            '{schema_version:1,source:"atomic_release",target_sha:$target_sha,tag:$tag,source_release_run_id:$source_release_run_id,source_release_run_attempt:$source_release_run_attempt,run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,conclusion:$conclusion}' \
            > release-integrity.json

      - name: Upload exact release integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-${{ needs.resolve-automatic-target.outputs.target_sha }}-${{ github.run_attempt }}
          path: release-integrity.json
          if-no-files-found: error
          retention-days: 14

  verify-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify selected published release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-ref.mjs --tag "$RELEASE_TAG"
