name: Trusted enforcement

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]
  issues:
    types: [edited]

concurrency:
  group: trusted-enforcement-${{ github.event.pull_request.number || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trusted-enforcement:
    name: trusted-enforcement-producer
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft && vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID != '' }}
    environment: trusted-enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted enforcement source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire exact candidate and test-merge evidence
        id: evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
          OBSERVED_HEAD="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/head)"
          MERGE_SHA="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/merge)"
          MERGE_BASE="$(git rev-parse "${MERGE_SHA}^1")"
          MERGE_HEAD="$(git rev-parse "${MERGE_SHA}^2")"
          CURRENT_BASE="$(git rev-parse refs/remotes/origin/main)"
          test "$OBSERVED_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_BASE" = "$CURRENT_BASE"
          echo "head_sha=$OBSERVED_HEAD" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Mint dedicated trusted-enforcement App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_ENFORCEMENT_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Mark trusted enforcement pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=trusted-enforcement \
            -f description="accepted repo-guard is evaluating this PR" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run accepted repo-guard
        id: enforcement
        continue-on-error: true
        uses: ./
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish trusted enforcement result
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
          ENFORCEMENT_OUTCOME: ${{ steps.enforcement.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ENFORCEMENT_OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="accepted repo-guard approved this PR"
          else
            STATE=failure
            DESCRIPTION="accepted repo-guard rejected this PR"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context=trusted-enforcement \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce trusted result
        if: ${{ always() }}
        env:
          ENFORCEMENT_OUTCOME: ${{ steps.enforcement.outcome }}
        run: |
          set -euo pipefail
          test "$ENFORCEMENT_OUTCOME" = "success"


  linked-issue-authority-invalidation:
    name: linked-issue-authority-invalidation
    if: ${{ github.event_name == 'issues' && github.event.changes.body != null && vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID != '' }}
    environment: trusted-enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Resolve affected Ready PR heads
        id: affected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          AFFECTED_PATH="${RUNNER_TEMP}/linked-issue-affected-pr-heads.tsv"
          : > "$AFFECTED_PATH"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/timeline?per_page=100" \
            --jq '.[] | select(.event == "cross-referenced" and .source.issue.pull_request != null and .source.issue.state == "open") | .source.issue.number' \
            | sort -nu \
            | while read -r PR_NUMBER; do
                [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || continue
                PR_META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.draft, .base.ref, .head.sha] | @tsv')"
                IFS=$'\t' read -r DRAFT BASE_REF HEAD_SHA <<< "$PR_META"
                if [[ "$DRAFT" != "false" || "$BASE_REF" != "main" || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                  continue
                fi

                PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
                if printf '%s' "$PR_BODY" \
                  | ISSUE_NUMBER="$ISSUE_NUMBER" REPOSITORY="$GITHUB_REPOSITORY" perl -0 -ne '
                      my $issue = quotemeta($ENV{"ISSUE_NUMBER"});
                      my $repo = quotemeta($ENV{"REPOSITORY"});
                      $found = 1 if /\b(?:Fixes|Closes|Resolves|Part\s+of)\s+(?:$repo)?#${issue}\b/i;
                      END { exit($found ? 0 : 1) }
                    '; then
                  printf '%s\t%s\n' "$PR_NUMBER" "$HEAD_SHA" >> "$AFFECTED_PATH"
                fi
              done

          COUNT="$(wc -l < "$AFFECTED_PATH" | tr -d ' ')"
          echo "path=$AFFECTED_PATH" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Mint dedicated trusted-enforcement App token
        if: ${{ steps.affected.outputs.count != '0' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_ENFORCEMENT_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Invalidate stale trusted enforcement
        if: ${{ steps.affected.outputs.count != '0' && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AFFECTED_PATH: ${{ steps.affected.outputs.path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r PR_NUMBER HEAD_SHA; do
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=pending \
              -f context=trusted-enforcement \
              -f description="linked issue #${ISSUE_NUMBER} changed; trusted reevaluation required" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done < "$AFFECTED_PATH"

      - name: Checkout accepted enforcement source for unambiguous refresh
        if: ${{ steps.affected.outputs.count == '1' && steps.app-token.outcome == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire exact single-PR refresh evidence
        if: ${{ steps.affected.outputs.count == '1' && steps.app-token.outcome == 'success' }}
        id: refresh-evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFFECTED_PATH: ${{ steps.affected.outputs.path }}
        run: |
          set -euo pipefail
          IFS=\t' read -r PR_NUMBER EXPECTED_HEAD_SHA < "$AFFECTED_PATH"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          PR_JSON="${RUNNER_TEMP}/linked-issue-refresh-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$PR_JSON"
          DRAFT="$(jq -r '.draft' "$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' "$PR_JSON")"
          CURRENT_HEAD="$(jq -r '.head.sha' "$PR_JSON")"
          test "$DRAFT" = "false"
          test "$BASE_REF" = "main"
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD_SHA"

          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
          OBSERVED_HEAD="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/head)"
          MERGE_SHA="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/merge)"
          MERGE_BASE="$(git rev-parse "${MERGE_SHA}^1")"
          MERGE_HEAD="$(git rev-parse "${MERGE_SHA}^2")"
          CURRENT_BASE="$(git rev-parse refs/remotes/origin/main)"
          test "$OBSERVED_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_BASE" = "$CURRENT_BASE"

          EVENT_PATH="${RUNNER_TEMP}/linked-issue-refresh-pull-request.json"
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg baseSha "$CURRENT_BASE" \
            --arg baseRef "$BASE_REF" \
            --arg headSha "$OBSERVED_HEAD" \
            --arg repo "$GITHUB_REPOSITORY" \
            --slurpfile pr "$PR_JSON" \
            '{
              pull_request: {
                number: $number,
                base: { sha: $baseSha, ref: $baseRef },
                head: { sha: $headSha },
                body: ($pr[0].body // "")
              },
              repository: { full_name: $repo }
            }' > "$EVENT_PATH"

          echo "event_path=$EVENT_PATH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$OBSERVED_HEAD" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Re-evaluate accepted repo-guard on unchanged PR head
        if: ${{ steps.affected.outputs.count == '1' && steps.refresh-evidence.outcome == 'success' }}
        id: refresh-enforcement
        continue-on-error: true
        uses: ./
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ steps.refresh-evidence.outputs.event_path }}

      - name: Publish refreshed trusted enforcement result
        if: ${{ always() && steps.affected.outputs.count == '1' && steps.app-token.outcome == 'success' && steps.refresh-evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.refresh-evidence.outputs.head_sha }}
          ENFORCEMENT_OUTCOME: ${{ steps.refresh-enforcement.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ENFORCEMENT_OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="linked issue changed; accepted repo-guard approved unchanged PR head"
          else
            STATE=failure
            DESCRIPTION="linked issue changed; accepted repo-guard rejected unchanged PR head"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context=trusted-enforcement \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce refreshed trusted result
        if: ${{ always() && steps.affected.outputs.count == '1' && steps.refresh-evidence.outcome == 'success' }}
        env:
          ENFORCEMENT_OUTCOME: ${{ steps.refresh-enforcement.outcome }}
        run: |
          set -euo pipefail
          test "$ENFORCEMENT_OUTCOME" = "success"
