name: Trusted enforcement

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: trusted-enforcement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trusted-enforcement:
    name: trusted-enforcement-producer
    if: ${{ !github.event.pull_request.draft && vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID != '' }}
    environment: trusted-enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted enforcement source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire exact candidate and test-merge evidence
        id: evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
          OBSERVED_HEAD="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/head)"
          MERGE_SHA="$(git rev-parse refs/remotes/pull/${PR_NUMBER}/merge)"
          MERGE_BASE="$(git rev-parse "${MERGE_SHA}^1")"
          MERGE_HEAD="$(git rev-parse "${MERGE_SHA}^2")"
          CURRENT_BASE="$(git rev-parse refs/remotes/origin/main)"
          test "$OBSERVED_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$MERGE_BASE" = "$CURRENT_BASE"
          echo "head_sha=$OBSERVED_HEAD" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Mint dedicated trusted-enforcement App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.TRUSTED_ENFORCEMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_ENFORCEMENT_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Mark trusted enforcement pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=trusted-enforcement \
            -f description="accepted repo-guard is evaluating this PR" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run accepted repo-guard
        id: enforcement
        continue-on-error: true
        uses: ./
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish trusted enforcement result
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
          ENFORCEMENT_OUTCOME: ${{ steps.enforcement.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ENFORCEMENT_OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="accepted repo-guard approved this PR"
          else
            STATE=failure
            DESCRIPTION="accepted repo-guard rejected this PR"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context=trusted-enforcement \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce trusted result
        if: ${{ always() }}
        env:
          ENFORCEMENT_OUTCOME: ${{ steps.enforcement.outcome }}
        run: |
          set -euo pipefail
          test "$ENFORCEMENT_OUTCOME" = "success"
