name: C3.10a one-shot historical BASE fix

on:
  push:
    branches:
      - c3.10a/505-external-base-projection

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c3.10a/505-external-base-projection
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Remove consumer-schema snapshot path and use historical projection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/github-pr.mts')
          text = path.read_text()
          old_import = 'import { getDiff, readBasePolicy, readFileAtRef, resolveRemoteBaseRef } from "./git.mjs";'
          new_import = 'import { getDiff, readBasePolicy, resolveRemoteBaseRef } from "./git.mjs";'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          start = text.index('function readOptionalBaseSchema(')
          end = text.index('export function loadGitHubEvent()', start)
          text = text[:start] + text[end:]

          old = '      schemas: readBaseSchemaSnapshot(base, roots.repoRoot),'
          new = '      historicalBase: true,'
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm tests/test-base-schema-snapshot.mjs

      - name: Build generated runtime
        run: |
          npm ci
          npm run build

      - name: Commit final bounded change
        shell: bash
        run: |
          rm .github/workflows/c3-10a-apply-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/github-pr.mts src/runtime/validation.mts src/policy-vocabulary.mts tests/test-c3-10a-external-base-cutover.mjs tests/test-base-schema-snapshot.mjs dist .github/workflows/c3-10a-apply-fix.yml
          git commit -m "fix(c3.10a): project historical BASE onto current vocabulary"
          git push origin HEAD:c3.10a/505-external-base-projection
