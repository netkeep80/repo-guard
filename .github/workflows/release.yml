name: Atomic release

on:
  repository_dispatch:
    types: [release]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.proof.outputs.sha }}
      version: ${{ steps.proof.outputs.version }}
      tag: ${{ steps.proof.outputs.tag }}
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install read-only preflight dependencies
        run: npm ci

      - name: Prove exact accepted release target
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          RESULT="$(node scripts/release-preflight.mjs --sha "$TARGET_SHA" --repo "$GITHUB_REPOSITORY")"
          SHA="$(jq -er '.sha' <<<"$RESULT")"
          VERSION="$(jq -er '.version' <<<"$RESULT")"
          TAG="$(jq -er '.tag' <<<"$RESULT")"
          test "$SHA" = "$TARGET_SHA"
          test "$TAG" = "v${VERSION}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ needs.preflight.outputs.sha }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Publish exact tag and Release
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TAG" = "v${VERSION}"

          if EXISTING_TAG_SHA="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq '.sha' 2>/dev/null)"; then
            [[ "$EXISTING_TAG_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXISTING_TAG_SHA" = "$TARGET_SHA"
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$TARGET_SHA" >/dev/null
          fi

          TAG_SHA="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq '.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"

          if RELEASE_STATE="$(gh api "repos/${REPOSITORY}/releases/tags/${TAG}" --jq '[.tag_name, .draft, .prerelease] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r RELEASE_TAG RELEASE_DRAFT RELEASE_PRERELEASE <<<"$RELEASE_STATE"
            test "$RELEASE_TAG" = "$TAG"
            test "$RELEASE_DRAFT" = "false"
            test "$RELEASE_PRERELEASE" = "false"
          else
            gh api --method POST "repos/${REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          FINAL_TAG_SHA="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq '.sha')"
          test "$FINAL_TAG_SHA" = "$TARGET_SHA"

          FINAL_RELEASE_STATE="$(gh api "repos/${REPOSITORY}/releases/tags/${TAG}" --jq '[.tag_name, .draft, .prerelease] | @tsv')"
          IFS=$'\t' read -r FINAL_RELEASE_TAG FINAL_DRAFT FINAL_PRERELEASE <<<"$FINAL_RELEASE_STATE"
          test "$FINAL_RELEASE_TAG" = "$TAG"
          test "$FINAL_DRAFT" = "false"
          test "$FINAL_PRERELEASE" = "false"
