format: repo-guard/requirement-v1
id: RG-06
normative: "### RG-06 — Явное подключение и честный охват\n\n**`MUST`:** consumer явно выбирает неизменяемую версию RepoGuard и точные `BASE/HEAD`; отсутствие необходимых Requirements, Relations, предметного CI или платформенного required check нельзя выдавать за установленную защиту. **`SHOULD`:** первое полезное подключение моделирует только реально нужную причинную границу и не требует искусственной конфигурации.\n\nРиск — процессный барьер без пользы или ложное ощущение защищённости. Нарушение — инструмент обещает merge protection или предметную корректность, которых фактически не наблюдает.\n\nСредства: тонкий CLI/Action поверх `check`, обычный CI и настройки защиты ветки платформы."
