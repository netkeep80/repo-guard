format: repo-guard/requirement-v1
id: RG-01
normative: "### RG-01 — Независимая проверка принятого состояния\n\n**`MUST`:** семантический verdict для изменения вычисляется детерминированно по точным `BASE/HEAD` и версионированным требованиям, отношениям, ограничениям и проекциям принятого снимка. Изменяемое описание PR, связанная задача, внешний сервис или секрет не должны менять результат для тех же входных снимков.\n\nРиск — кандидат подменяет критерии собственной проверки или результат зависит от невоспроизводимого внешнего состояния. Нарушение — одинаковые `BASE/HEAD` дают разный семантический результат без изменения версионированных входов.\n\nСредства: локальный compiler-only runtime, независимый BASE-owned compiler gate, обычный CI/CD и платформенные права review/merge."
relations:
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: ".github/workflows/compiler-gate.yml"
  - predicates: [verified_by]
    target:
      kind: artifact
      path: "tests/test-788-compiler-gate.mjs"
  - predicates: [documents]
    target:
      kind: artifact
      path: "README.md"
