format: repo-guard/requirement-v1
id: RG-01
normative: "### RG-01 — Независимая проверка принятого состояния\n\n**`MUST`:** намерение изменения не выдаёт разрешение менять правила управления. Компилятор проверяет точные `BASE/HEAD` относительно принятого `BASE` и версионированных требований, отношений и ограничений. Решение должно быть воспроизводимо локально, без обращения к изменяемым описаниям запросов на слияние или связанных задач для установления полномочий.\n\nРиск — кандидат подменяет критерии собственной проверки либо результат зависит от состояния внешнего сервиса. Нарушение — семантический вердикт по тем же `BASE/HEAD` меняется из-за тела PR, связанной задачи, внешнего авторизатора или секрета. Машинно проверяются точные Git-редакции, нормативные входы и диагностируемые ограничения; человеческая приёмка и разрешение слияния остаются вне компилятора.\n\nСредства: детерминированный локальный компилятор, обычный CI/CD, ревью и настройки прав/защиты ветки платформы. Отдельные приложения, сервисы, секреты, разрешения `GovernanceGrant` или производитель статуса `trusted-enforcement` не требуются для семантической проверки.\n"
