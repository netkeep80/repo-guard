format: repo-guard/requirement-v1
id: RG-01
normative: "### RG-01 — Независимая authority\n\n**`MUST`:** обязательный семантический gate самоприменения исполняет принятый компилятор из доверенного состояния BASE и рассматривает содержимое кандидата только как данные. Кандидат не может получить GREEN, подменив workflow, CLI wrapper, dist или тесты, которые выбирают исполняемый evaluator. Решение о том, кто имеет право слить изменение, принадлежит платформе репозитория, а не семантике RepoGuard.\n\nРиск — исполнитель переписывает критерий собственной приёмки либо отключает обязательную проверку своим же PR. Нарушение — required check исполняет candidate-owned evaluator или зависит от PR metadata/секрета/внешнего сервиса для семантического вердикта. Машинно проверяются exact BASE/HEAD, идентичность evaluator и структурный non-bypass workflow; человеческая merge authorization остаётся branch-protection/review policy.\n\nСредства: exact Git BASE/HEAD, compiler-only `repo-guard check`, base-owned GitHub Actions workflow с минимальными read-only permissions и обычный required check. RepoGuard App, daemon, webhook, private key, GovernanceGrant, TransitionReceipt и WorkIntent не являются входами compiler gate. Legacy `trusted-enforcement` может физически сохраняться на переходе, но после C2 не является required authority.\n"
