format: repo-guard/requirement-v1
id: RG-02
normative: "### RG-02 — Принятие не выводится из готовности\n\n**`MUST`:** если проект различает кандидата, принятое, текущее или опубликованное состояние, эти факты задаются явно и не выводятся автоматически из зелёного CI, merge, закрытой задачи или номера версии.\n\nРиск — исследовательский или технически готовый кандидат незаметно становится предметной authority. Нарушение — consumer выбирает новое состояние только потому, что код собрался или был слит.\n\nСредства: версионированные lifecycle-факты и отношения точных снимков; предметное принятие остаётся решением владельца и не подменяется компилятором."
