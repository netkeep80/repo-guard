name: ChangeIntent
description: Capture a repo-guard ChangeIntent for linked issues.
title: "[change] "
body:
  - type: textarea
    id: change_intent
    attributes:
      label: ChangeIntent
      value: |
        ```repo-guard-yaml
        change_type: feature
        scope:
          - src/**
        anchors:
          affects:
            - FR-014
        must_touch:
          - tests/**
        must_not_touch: []
        expected_effects:
          - The linked issue carries the same ChangeIntent fields as a PR.
        ```
    validations:
      required: true
