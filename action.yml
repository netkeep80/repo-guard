name: "repo-guard"
description: "Enforce repository policy and ChangeIntent on pull requests"
author: "netkeep80"

branding:
  icon: "shield"
  color: "red"

inputs:
  mode:
    description: >
      Command mode. Use `check-pr` to validate a pull request against policy
      and ChangeIntent (requires GitHub Actions PR event context), `check-diff`
      to validate a local diff between two refs, or `portable-coordinator` to
      run the trusted portable integration coordinator.
    required: false
    default: "check-pr"

  enforcement:
    description: >
      Policy enforcement behavior. `blocking`/`enforce` fails the job when
      policy violations are found. `advisory`/`warn` reports violations but
      exits successfully so teams can observe noise before enforcing.
    required: false
    default: "blocking"

  repo-root:
    description: >
      Path to the repository root that contains `repo-policy.json`.
      Defaults to the root of the checked-out repository (`$GITHUB_WORKSPACE`).
    required: false
    default: ""

  base:
    description: >
      Base git ref for diff comparison (used with `mode: check-diff`).
      Example: `main` or a commit SHA.
    required: false
    default: ""

  head:
    description: >
      Head git ref for diff comparison (used with `mode: check-diff`).
      Example: `feature-branch` or a commit SHA.
    required: false
    default: ""

  change-intent:
    description: >
      Path to a ChangeIntent JSON file (used with `mode: check-diff`).
      Path is relative to `repo-root`.
    required: false
    default: ""

  repository:
    description: >
      Trusted repository identity (`owner/name`) for `mode: portable-coordinator`.
      If empty, the coordinator may use trusted `GITHUB_REPOSITORY`.
    required: false
    default: ""

  ready-label:
    description: "Trusted READY label for `mode: portable-coordinator`."
    required: false
    default: ""

  merge-method:
    description: >
      Merge method for `mode: portable-coordinator`: `merge`, `squash`, or
      `rebase`.
    required: false
    default: ""

  transaction-checks:
    description: >
      Required transaction check names for `mode: portable-coordinator`, one
      check name per line.
    required: false
    default: ""

  state-checks:
    description: >
      Required state check names for `mode: portable-coordinator`, one check
      name per line.
    required: false
    default: ""

  format:
    description: "Portable coordinator evidence format: `text` or `json`."
    required: false
    default: "text"

  node-version:
    description: "Node.js version to use when running repo-guard."
    required: false
    default: "24"

outputs:
  result:
    description: >
      Enforcement result: `passed` if all checks passed, `failed` if any check
      failed (including advisory violations), or `error` if repo-guard could not
      run (e.g. missing policy file).
    value: ${{ steps.run-repo-guard.outputs.result }}

  summary:
    description: "Human-readable one-line summary of the enforcement run."
    value: ${{ steps.run-repo-guard.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install repo-guard dependencies
      shell: bash
      run: |
        # Install runtime dependencies for the checked-out Action source.
        cd "${GITHUB_ACTION_PATH}"
        npm install --omit=dev --silent

    - name: Run repo-guard
      id: run-repo-guard
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_READY_LABEL: ${{ inputs.ready-label }}
        INPUT_MERGE_METHOD: ${{ inputs.merge-method }}
        INPUT_TRANSACTION_CHECKS: ${{ inputs.transaction-checks }}
        INPUT_STATE_CHECKS: ${{ inputs.state-checks }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        set +e

        if [ "$INPUT_MODE" = "portable-coordinator" ]; then
          # Privileged coordinator inputs stay data: build argv as a Bash array.
          CMD=(node "${GITHUB_ACTION_PATH}/dist/repo-guard.mjs" portable-coordinator)

          if [ -n "$INPUT_REPOSITORY" ]; then
            CMD+=(--repository "$INPUT_REPOSITORY")
          fi
          CMD+=(--ready-label "$INPUT_READY_LABEL")
          CMD+=(--merge-method "$INPUT_MERGE_METHOD")
          CMD+=(--format "$INPUT_FORMAT")

          while IFS= read -r CHECK; do
            if [ -n "$CHECK" ]; then
              CMD+=(--transaction-check "$CHECK")
            fi
          done <<< "$INPUT_TRANSACTION_CHECKS"

          while IFS= read -r CHECK; do
            if [ -n "$CHECK" ]; then
              CMD+=(--state-check "$CHECK")
            fi
          done <<< "$INPUT_STATE_CHECKS"

          echo "Running portable coordinator"
          OUTPUT=$("${CMD[@]}" 2>&1)
          EXIT_CODE=$?
        else
          # Always run the checked, generated runtime shipped with the Action.
          BIN="node ${GITHUB_ACTION_PATH}/dist/repo-guard.mjs"

          # Build the command
          CMD="$BIN"

          # Append --repo-root if provided; fall back to GITHUB_WORKSPACE
          REPO_ROOT="${{ inputs.repo-root }}"
          if [ -z "$REPO_ROOT" ]; then
            REPO_ROOT="${GITHUB_WORKSPACE:-$PWD}"
          fi
          CMD="$CMD --repo-root $REPO_ROOT"

          # Append enforcement behavior and command mode / sub-command
          ENFORCEMENT="${{ inputs.enforcement }}"
          if [ -n "$ENFORCEMENT" ]; then
            CMD="$CMD --enforcement $ENFORCEMENT"
          fi

          MODE="${{ inputs.mode }}"
          CMD="$CMD $MODE"

          # Append check-diff specific flags
          if [ "$MODE" = "check-diff" ]; then
            if [ -n "${{ inputs.base }}" ]; then
              CMD="$CMD --base ${{ inputs.base }}"
            fi
            if [ -n "${{ inputs.head }}" ]; then
              CMD="$CMD --head ${{ inputs.head }}"
            fi
            if [ -n "${{ inputs.change-intent }}" ]; then
              CMD="$CMD --change-intent ${{ inputs.change-intent }}"
            fi
          fi

          echo "Running: $CMD"
          OUTPUT=$($CMD 2>&1)
          EXIT_CODE=$?
        fi

        echo "$OUTPUT"

        # Derive result and summary outputs. Advisory mode can exit 0 while
        # still reporting policy violations, so prefer the CLI Result line.
        CLI_RESULT=$(echo "$OUTPUT" | sed -nE 's/^Result: ([a-z]+).*/\1/p' | tail -1)
        SUMMARY=$(echo "$OUTPUT" | grep -E "^Summary:" | tail -1)

        if [ $EXIT_CODE -eq 0 ]; then
          RESULT="${CLI_RESULT:-passed}"
          if [ -z "$SUMMARY" ]; then
            SUMMARY="repo-guard: all checks passed"
          fi
        else
          # Distinguish configuration/runtime errors from enforcement failures
          if echo "$OUTPUT" | grep -qE "^(ERROR|FAIL: repo-policy)"; then
            RESULT="error"
          else
            RESULT="${CLI_RESULT:-failed}"
          fi
          if [ -z "$SUMMARY" ]; then
            SUMMARY="repo-guard: one or more checks failed (exit $EXIT_CODE)"
          fi
        fi

        echo "result=$RESULT" >> "$GITHUB_OUTPUT"
        echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE
