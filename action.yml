name: "repo-guard"
description: "Enforce repository policy and ChangeIntent on pull requests"
author: "netkeep80"

branding:
  icon: "shield"
  color: "red"

inputs:
  mode:
    description: >
      Command mode. Use `check-pr` to validate a pull request against policy
      and ChangeIntent (requires GitHub Actions PR event context), or `check-diff`
      to validate a local diff between two refs.
    required: false
    default: "check-pr"

  enforcement:
    description: >
      Policy enforcement behavior. `blocking` fails the job when policy
      violations are found. `advisory` reports violations but exits
      successfully so teams can observe noise before enforcing.
    required: false
    default: "blocking"

  repo-root:
    description: >
      Path to the repository root that contains `repo-policy.json`.
      Defaults to the root of the checked-out repository (`$GITHUB_WORKSPACE`).
    required: false
    default: ""

  base:
    description: >
      Base git ref for diff comparison (used with `mode: check-diff`).
      Example: `main` or a commit SHA.
    required: false
    default: ""

  head:
    description: >
      Head git ref for diff comparison (used with `mode: check-diff`).
      Example: `feature-branch` or a commit SHA.
    required: false
    default: ""

  change-intent:
    description: >
      Path to a ChangeIntent JSON file (used with `mode: check-diff`).
      Path is relative to `repo-root`.
    required: false
    default: ""

  node-version:
    description: "Node.js version to use when running repo-guard."
    required: false
    default: "24"

outputs:
  result:
    description: >
      Enforcement result derived from the structured report: `passed`, `failed`,
      or `error` when repo-guard could not produce a valid machine report.
    value: ${{ steps.run-repo-guard.outputs.result }}

  summary:
    description: "Human-readable one-line summary derived from the structured report."
    value: ${{ steps.run-repo-guard.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install repo-guard dependencies
      shell: bash
      run: |
        cd "${GITHUB_ACTION_PATH}"
        npm install --omit=dev --silent

    - name: Run repo-guard
      id: run-repo-guard
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        RG_MODE: ${{ inputs.mode }}
        RG_ENFORCEMENT: ${{ inputs.enforcement }}
        RG_REPO_ROOT: ${{ inputs.repo-root }}
        RG_BASE: ${{ inputs.base }}
        RG_HEAD: ${{ inputs.head }}
        RG_CHANGE_INTENT: ${{ inputs.change-intent }}
      run: |
        set +e
        REPO_ROOT="${RG_REPO_ROOT:-${GITHUB_WORKSPACE:-$PWD}}"
        REPORT_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/repo-guard-report.XXXXXX.json")"
        ARGS=(node "${GITHUB_ACTION_PATH}/dist/repo-guard.mjs" --repo-root "$REPO_ROOT")
        if [ -n "$RG_ENFORCEMENT" ]; then ARGS+=(--enforcement "$RG_ENFORCEMENT"); fi

        case "$RG_MODE" in
          check-pr)
            ARGS+=(check-pr --format json)
            ;;
          check-diff)
            ARGS+=(check-diff --format json)
            if [ -n "$RG_BASE" ]; then ARGS+=(--base "$RG_BASE"); fi
            if [ -n "$RG_HEAD" ]; then ARGS+=(--head "$RG_HEAD"); fi
            if [ -n "$RG_CHANGE_INTENT" ]; then ARGS+=(--change-intent "$RG_CHANGE_INTENT"); fi
            ;;
          *)
            : > "$REPORT_FILE"
            CLI_EXIT=1
            ;;
        esac

        if [ "$RG_MODE" = "check-pr" ] || [ "$RG_MODE" = "check-diff" ]; then
          "${ARGS[@]}" > "$REPORT_FILE"
          CLI_EXIT=$?
        fi

        node --input-type=module - "$REPORT_FILE" "$GITHUB_OUTPUT" <<'NODE'
        import { readFileSync, appendFileSync } from "node:fs";
        const [reportPath, outputPath] = process.argv.slice(2);
        let report = null;
        try { report = JSON.parse(readFileSync(reportPath, "utf8")); } catch {}
        const machineResult = report?.result;
        const result = machineResult === "failed" ? "failed"
          : machineResult === "error" ? "error"
          : machineResult === "passed" || machineResult === "passed_with_warnings" ? "passed"
          : "error";
        const number = (value) => Number.isFinite(value) ? value : 0;
        const mode = report?.mode === "advisory" ? "advisory" : report?.mode === "blocking" ? "blocking" : "unknown";
        const summary = report
          ? `repo-guard: ${result}; ${number(report.passed)} passed, ${number(report.violationCount)} violation(s), ${number(report.warnings)} warning(s); mode ${mode}`
          : "repo-guard: error; structured report unavailable";
        appendFileSync(outputPath, `result=${result}\nsummary=${summary}\n`);
        if (!report) process.exitCode = 2;
        NODE
        ADAPTER_EXIT=$?
        rm -f "$REPORT_FILE"
        if [ $ADAPTER_EXIT -ne 0 ]; then exit 1; fi
        exit "$CLI_EXIT"
