name: "repo-guard"
description: "Run deterministic RepoGuard causal compiler on exact repository snapshots"
author: "netkeep80"

branding:
  icon: "shield"
  color: "red"

inputs:
  repo-root:
    description: "Repository root to evaluate. Defaults to GITHUB_WORKSPACE."
    required: false
    default: ""
  base:
    description: "Exact 40-character BASE commit SHA; defaults to the PR event BASE SHA."
    required: false
    default: ""
  head:
    description: "Exact 40-character HEAD commit SHA; defaults to the PR event HEAD SHA."
    required: false
    default: ""
  node-version:
    description: "Node.js version to use when running repo-guard."
    required: false
    default: "24"

outputs:
  result:
    description: "Compiler result: passed, failed, or error."
    value: ${{ steps.run-repo-guard.outputs.result }}
  summary:
    description: "Human-readable one-line compiler summary."
    value: ${{ steps.run-repo-guard.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install repo-guard dependencies
      shell: bash
      run: |
        cd "${GITHUB_ACTION_PATH}"
        npm install --omit=dev --silent

    - name: Run repo-guard
      id: run-repo-guard
      shell: bash
      env:
        RG_REPO_ROOT: ${{ inputs.repo-root }}
        RG_BASE: ${{ inputs.base }}
        RG_HEAD: ${{ inputs.head }}
        RG_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        RG_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set +e
        REPO_ROOT="${RG_REPO_ROOT:-${GITHUB_WORKSPACE:-$PWD}}"
        BASE_SHA="${RG_BASE:-$RG_EVENT_BASE}"
        HEAD_SHA="${RG_HEAD:-$RG_EVENT_HEAD}"
        REPORT_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/repo-guard-report.XXXXXX.json")"

        if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          node "${GITHUB_ACTION_PATH}/dist/repo-guard.mjs" --repo-root "$REPO_ROOT"             check --base "$BASE_SHA" --head "$HEAD_SHA" --format json > "$REPORT_FILE"
          CLI_EXIT=$?
        else
          : > "$REPORT_FILE"
          CLI_EXIT=1
        fi

        node --input-type=module - "$REPORT_FILE" "$GITHUB_OUTPUT" "$CLI_EXIT" <<'NODE'
        import { readFileSync, appendFileSync } from "node:fs";
        const [reportPath, outputPath, cliExitRaw] = process.argv.slice(2);
        const cliExit = Number(cliExitRaw);
        let report = null;
        try { report = JSON.parse(readFileSync(reportPath, "utf8")); } catch {}
        const valid = report?.format === "repo-guard/local-compiler-v1"
          && typeof report.ok === "boolean"
          && typeof report.base === "string"
          && typeof report.head === "string"
          && cliExit === (report.ok ? 0 : 1);
        const result = valid ? (report.ok ? "passed" : "failed") : "error";
        const summary = valid
          ? `repo-guard: ${result}; J1 ${report.j1?.justified}/${report.j1?.tracked}; J2 ${report.j2?.rooted}; diagnostics ${report.diagnostics?.length}`
          : "repo-guard: error; structured compiler report unavailable or inconsistent";
        appendFileSync(outputPath, `result=${result}\nsummary=${summary}\n`);
        process.exitCode = valid ? cliExit : 1;
        NODE
        ADAPTER_EXIT=$?
        rm -f "$REPORT_FILE"
        exit "$ADAPTER_EXIT"
